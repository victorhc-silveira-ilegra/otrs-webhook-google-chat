minimum_pre_commit_version: "3.5.0"

default_language_version:
  python: python3.13

repos:
  - repo: local
    hooks:
      # ---- LINT & QUALIDADE ----
      - id: lint
        name: Qualidade (Ruff, Mypy, Vulture, limite de linhas)
        entry: linters/git-hooks/bin/python app/scripts/operations/clean_workspace.py --stage lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # ---- TESTES & COBERTURA ----
      - id: test
        name: Testes (pytest + cobertura 100%)
        entry: linters/git-hooks/bin/python app/scripts/operations/clean_workspace.py --stage test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # ---- SEGURANCA ----
      - id: security
        name: Seguranca (Bandit + pip-audit)
        entry: linters/git-hooks/bin/python app/scripts/operations/clean_workspace.py --stage security
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # ---- COMMITLINT (Node.js via npx) ----
      - id: commitlint
        name: Commitlint (Conventional Commits)
        entry: npx --yes -p @commitlint/cli -p @commitlint/config-conventional commitlint --config linters/commitlint.config.mjs --edit
        language: system
        stages: [commit-msg]

      # ---- LIMPEZA ----
      - id: cleanup
        name: Limpeza (caches e artefatos locais)
        entry: linters/git-hooks/bin/python app/scripts/operations/clean_workspace.py --stage clean --light-clean
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
