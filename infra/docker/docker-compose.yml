services:
  mariadb:
    image: mariadb:10.4
    container_name: otrs-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: otrs
      MYSQL_USER: otrs
      MYSQL_PASSWORD: otrssecret
    command:
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci
      - --max_allowed_packet=64M
      - --innodb_log_file_size=256M
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb/init.sql:/docker-entrypoint-initdb.d/00-init-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 10s
      timeout: 5s
      retries: 10

  mock-webhook:
    image: wiremock/wiremock:3.9.1
    container_name: otrs-mock-webhook
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./wiremock:/home/wiremock
    command: ["--disable-banner", "--global-response-templating"]

  notifier:
    build:
      context: ../..
      dockerfile: infra/docker/notifier/Dockerfile
    container_name: otrs-notifier
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      GCHAT_WEBHOOK_URL: ${GCHAT_WEBHOOK_URL}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-10}
      DEDUP_ENABLED: "true"
      DEDUP_WINDOW_MINUTES: ${DEDUP_WINDOW_MINUTES:-30}
      LOG_DIR: /var/log/otrs-gchat
      OTRS_DB_HOST: mariadb
      OTRS_DB_PORT: "3306"
      OTRS_DB_NAME: otrs
      OTRS_DB_USER: otrs
      OTRS_DB_PASSWORD: otrssecret
    volumes:
      - ../../logs:/var/log/otrs-gchat
    depends_on:
      mariadb:
        condition: service_healthy
      mock-webhook:
        condition: service_started

  otrs:
    build:
      context: ../..
      dockerfile: infra/docker/otrs/Dockerfile
    container_name: otrs-app
    restart: unless-stopped
    ports:
      - "8081:80"
    env_file:
      - path: ../../.env
        required: false
    environment:
      OTRS_DB_HOST: mariadb
      OTRS_DB_PORT: "3306"
      OTRS_DB_NAME: otrs
      OTRS_DB_USER: otrs
      OTRS_DB_PASSWORD: otrssecret
      OTRS_ROOT_PASSWORD: "root@localhost"
      NOTIFIER_BIN: /opt/notifier/bin/otrs-gchat-alert
      GCHAT_WEBHOOK_URL: ${GCHAT_WEBHOOK_URL}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-10}
      DEDUP_ENABLED: "true"
      DEDUP_WINDOW_MINUTES: ${DEDUP_WINDOW_MINUTES:-30}
      LOG_DIR: /var/log/otrs-gchat
    volumes:
      - ./otrs/Kernel/System/Ticket/Event/GoogleChatAlert.pm:/opt/otrs/Kernel/System/Ticket/Event/GoogleChatAlert.pm:ro
      - ./otrs/Kernel/Config/Files/GoogleChatAlert.xml:/opt/otrs/Kernel/Config/Files/GoogleChatAlert.xml:ro
      - ../../logs:/var/log/otrs-gchat
    depends_on:
      mariadb:
        condition: service_healthy
      mock-webhook:
        condition: service_started
      notifier:
        condition: service_started

volumes:
  mariadb_data:
